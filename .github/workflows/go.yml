# This file adheres to the YAML5 style.
{
  name: "Go",
  on: ["push", "pull_request"],
  jobs: {
    build: {
      name: "Build",
      "runs-on": "ubuntu-latest",
      steps: [
        {uses: "actions/checkout@v4"},
        {
          uses: "actions/setup-go@v5",
          "with": {"go-version-file": "go.mod"},
        },
        {name: "Tools", run: "sudo apt-get install -y ragel && go install golang.org/x/tools/cmd/goyacc@v0.24.0"},
        {
          // The generated scanner/parser must match the committed .rl/.y sources.
          name: "Generated code is up to date",
          run: "touch internal/*/*.rl internal/*/*.y && make compile && go generate ./internal/php8 && gofmt -s -w internal && git diff --exit-code -- internal",
        },
        {name: "Tests", run: "go test ./..."},
        {name: "Fuzz (short)", run: "go test ./pkg/parser -run '^$' -fuzz FuzzParse -fuzztime 60s"},
      ],
    },
  },
}
